name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  JAVA_VERSION: '23'
  MAVEN_OPTS: '-Xmx1024m'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: equity_swaps_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: maven

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run unit tests
      run: |
        mvn clean test \
          -Dspring.profiles.active=test \
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/equity_swaps_test \
          -Dspring.datasource.username=test_user \
          -Dspring.datasource.password=test_pass \
          -Dspring.redis.host=localhost \
          -Dspring.redis.port=6379

    - name: Run integration tests
      run: |
        mvn verify -P integration-tests \
          -Dspring.profiles.active=test \
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/equity_swaps_test \
          -Dspring.datasource.username=test_user \
          -Dspring.datasource.password=test_pass

    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Maven Tests
        path: '**/target/surefire-reports/*.xml'
        reporter: java-junit

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./target/site/jacoco/jacoco.xml
        flags: unittests
        name: codecov-umbrella

  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: maven

    - name: Build project
      run: mvn clean package -DskipTests

    - name: Build Docker images
      run: |
        docker build -t equity-swaps/position-service:${{ github.sha }} ./position-service
        docker build -t equity-swaps/lot-service:${{ github.sha }} ./lot-service
        docker build -t equity-swaps/cashflow-service:${{ github.sha }} ./cashflow-service

    - name: Save Docker images
      if: github.event_name != 'pull_request'
      run: |
        docker save equity-swaps/position-service:${{ github.sha }} | gzip > position-service.tar.gz
        docker save equity-swaps/lot-service:${{ github.sha }} | gzip > lot-service.tar.gz
        docker save equity-swaps/cashflow-service:${{ github.sha }} | gzip > cashflow-service.tar.gz

    - name: Upload artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v3
      with:
        name: docker-images
        path: '*.tar.gz'
        retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: maven

    - name: Run OWASP Dependency Check
      run: |
        mvn org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=8 \
          -DsuppressionsLocation=owasp-suppressions.xml

    - name: Upload OWASP report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: owasp-report
        path: target/dependency-check-report.html

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: maven

    - name: Cache SonarCloud packages
      uses: actions/cache@v3
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Run SonarCloud analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn clean verify sonar:sonar \
          -Dsonar.projectKey=equity-swaps-microservices \
          -Dsonar.organization=your-org \
          -Dsonar.host.url=https://sonarcloud.io

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, security, quality]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        name: docker-images

    - name: Load Docker images
      run: |
        docker load < position-service.tar.gz
        docker load < lot-service.tar.gz
        docker load < cashflow-service.tar.gz

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Tag and push Docker images
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY_PREFIX: equity-swaps
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Position Service
        docker tag equity-swaps/position-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/position-service:$IMAGE_TAG
        docker tag equity-swaps/position-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/position-service:staging
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/position-service:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/position-service:staging
        
        # Lot Service
        docker tag equity-swaps/lot-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/lot-service:$IMAGE_TAG
        docker tag equity-swaps/lot-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/lot-service:staging
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/lot-service:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/lot-service:staging
        
        # Cashflow Service
        docker tag equity-swaps/cashflow-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/cashflow-service:$IMAGE_TAG
        docker tag equity-swaps/cashflow-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/cashflow-service:staging
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/cashflow-service:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/cashflow-service:staging

    - name: Deploy to EKS staging
      run: |
        aws eks update-kubeconfig --region us-east-1 --name equity-swaps-staging
        
        # Update image tags in Kubernetes manifests
        sed -i "s|{{IMAGE_TAG}}|${{ github.sha }}|g" k8s/staging/*.yaml
        
        # Apply Kubernetes manifests
        kubectl apply -f k8s/staging/

    - name: Run smoke tests
      run: |
        # Wait for deployments to be ready
        kubectl wait --for=condition=available --timeout=300s deployment/position-service -n equity-swaps-staging
        kubectl wait --for=condition=available --timeout=300s deployment/lot-service -n equity-swaps-staging
        kubectl wait --for=condition=available --timeout=300s deployment/cashflow-service -n equity-swaps-staging
        
        # Run smoke tests
        ./scripts/smoke-tests.sh staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security, quality]
    if: github.event_name == 'release'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v3
      with:
        name: docker-images

    - name: Load Docker images
      run: |
        docker load < position-service.tar.gz
        docker load < lot-service.tar.gz
        docker load < cashflow-service.tar.gz

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Tag and push Docker images for production
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY_PREFIX: equity-swaps
        IMAGE_TAG: ${{ github.sha }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        # Position Service
        docker tag equity-swaps/position-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/position-service:$RELEASE_TAG
        docker tag equity-swaps/position-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/position-service:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/position-service:$RELEASE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/position-service:latest
        
        # Lot Service
        docker tag equity-swaps/lot-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/lot-service:$RELEASE_TAG
        docker tag equity-swaps/lot-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/lot-service:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/lot-service:$RELEASE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/lot-service:latest
        
        # Cashflow Service
        docker tag equity-swaps/cashflow-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/cashflow-service:$RELEASE_TAG
        docker tag equity-swaps/cashflow-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/cashflow-service:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/cashflow-service:$RELEASE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/cashflow-service:latest

    - name: Deploy to EKS production
      run: |
        aws eks update-kubeconfig --region us-east-1 --name equity-swaps-production
        
        # Update image tags in Kubernetes manifests
        sed -i "s|{{IMAGE_TAG}}|${{ github.event.release.tag_name }}|g" k8s/production/*.yaml
        
        # Apply Kubernetes manifests with rolling update
        kubectl apply -f k8s/production/

    - name: Run production health checks
      run: |
        # Wait for deployments to be ready
        kubectl wait --for=condition=available --timeout=600s deployment/position-service -n equity-swaps-production
        kubectl wait --for=condition=available --timeout=600s deployment/lot-service -n equity-swaps-production
        kubectl wait --for=condition=available --timeout=600s deployment/cashflow-service -n equity-swaps-production
        
        # Run comprehensive health checks
        ./scripts/health-checks.sh production

    - name: Create deployment notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: |
          🚀 Production deployment completed successfully!
          Release: ${{ github.event.release.tag_name }}
          Commit: ${{ github.sha }}
          Actor: ${{ github.actor }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [test, build, security, quality]
    if: always()
    
    steps:
    - name: Notify on failure
      if: contains(needs.*.result, 'failure')
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#ci-cd'
        text: |
          ❌ CI/CD Pipeline failed!
          Branch: ${{ github.ref }}
          Commit: ${{ github.sha }}
          Actor: ${{ github.actor }}
          Failed jobs: ${{ join(needs.*.result, ', ') }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}